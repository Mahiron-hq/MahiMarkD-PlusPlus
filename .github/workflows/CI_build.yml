name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: MahiMarkD-PlusPlus
    strategy:
      fail-fast: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: add missing aarch64 toolchain for windows runner
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-pc-windows-msvc

    - name: Build of all plugin dlls as release variant
      working-directory: .\
      run: |
           cargo test
           cargo build --release
           .\scripts\package.ps1

    - name: Archive artifacts for x64
      uses: actions/upload-artifact@v7
      with:
          path: .\dist\${{ env.Projectname }}-*-x64.zip
          archive: false

    - name: Archive artifacts for x86
      uses: actions/upload-artifact@v7
      with:
          path: .\dist\${{ env.Projectname }}-*-x86.zip
          archive: false

    - name: Archive artifacts for arm64
      uses: actions/upload-artifact@v7
      with:
          path: .\dist\${{ env.Projectname }}-*-arm64.zip
          archive: false

    - name: Create release on tagging
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: ${{ env.Projectname }}-*.zip