<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://mahimarkd.localhost; style-src https://mahimarkd.localhost 'unsafe-inline'; img-src https: http: data: blob:; media-src https: http: data:; font-src https://mahimarkd.localhost data:; connect-src https://mahimarkd.localhost">
<title>MahiMarkD++</title>
<link rel="stylesheet" href="doc.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<header id="bar">
  <button id="btn-toc" class="icon-btn" type="button" title="Table of contents" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h.01M3 12h.01M3 19h.01M8 5h13M8 12h13M8 19h13"/></svg>
  </button>
  <span class="spacer"></span>
  <button id="btn-find" class="icon-btn" type="button" title="Find (Ctrl+F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </button>
  <div class="menu-wrap">
    <button id="btn-export" class="icon-btn" type="button" title="Export" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
    <div id="export-menu" class="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-kind="html">Export as HTML<span class="ext">.html</span></button>
      <button type="button" role="menuitem" data-kind="pdf">Export as PDF<span class="ext">.pdf</span></button>
      <button type="button" role="menuitem" data-kind="docx">Export as Word<span class="ext">.docx</span></button>
    </div>
  </div>
  <button id="btn-settings" class="icon-btn" type="button" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</header>

<div id="find" role="search" hidden>
  <input id="find-input" type="text" placeholder="Find in preview" spellcheck="false" autocomplete="off">
  <span id="find-count"></span>
  <button id="find-case" class="icon-btn" type="button" title="Match case" aria-pressed="false">Aa</button>
  <button id="find-prev" class="icon-btn" type="button" title="Previous (Shift+F3)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>
  <button id="find-next" class="icon-btn" type="button" title="Next (F3)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <button id="find-close" class="icon-btn" type="button" title="Close (Esc)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>

<nav id="toc" aria-label="Table of contents" hidden><ul id="toc-list"></ul></nav>

<main id="page">
  <article id="content" class="markdown-body"></article>
</main>

<div id="settings" hidden>
  <form class="sheet" id="settings-form" autocomplete="off">
    <h2><span>Settings</span>
      <button id="settings-close" class="icon-btn" type="button" title="Close (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </h2>
    <fieldset>
      <legend>Appearance</legend>
      <label class="row"><span>Theme<small>Auto follows the Notepad++ editor colors</small></span>
        <select name="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label class="row"><span>Font size, px</span><input name="fontSize" type="number" min="8" max="40" step="1"></label>
      <label class="row"><span>Text font<small>Empty for the default</small></span><input name="fontFamily" type="text" placeholder="Segoe UI"></label>
      <label class="row"><span>Code font<small>Empty for the default</small></span><input name="codeFontFamily" type="text" placeholder="Cascadia Mono"></label>
      <label class="row"><span>Content width, px<small>0 uses the full panel width</small></span><input name="contentWidth" type="number" min="0" max="4000" step="10"></label>
    </fieldset>
    <fieldset>
      <legend>Behavior</legend>
      <label class="row"><span>Open the preview for Markdown files</span><input name="autoOpen" type="checkbox"></label>
      <label class="row"><span>Markdown file extensions</span><input name="extensions" type="text"></label>
      <label class="row"><span>Sync scrolling with the editor</span><input name="scrollSync" type="checkbox"></label>
      <label class="row"><span>Click in the preview moves the editor caret</span><input name="clickToSource" type="checkbox"></label>
      <label class="row"><span>Math formulas ($...$, $$...$$)</span><input name="math" type="checkbox"></label>
      <label class="row"><span>Update delay while typing, ms</span><input name="renderDelayMs" type="number" min="0" max="2000" step="10"></label>
    </fieldset>
    <fieldset>
      <legend>Export</legend>
      <label class="row"><span>PDF page size</span>
        <select name="pdfPageSize"><option value="a4">A4</option><option value="letter">Letter</option></select></label>
    </fieldset>
    <div class="foot" id="settings-foot"></div>
  </form>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/hljs/highlight.min.js"></script>
<script src="vendor/hljs/powershell.min.js"></script>
<script src="vendor/hljs/dos.min.js"></script>
<script src="vendor/hljs/dockerfile.min.js"></script>
<script src="vendor/hljs/cmake.min.js"></script>
<script src="app.js"></script>
</body>
</html>
