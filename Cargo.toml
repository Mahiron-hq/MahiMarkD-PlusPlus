[package]
name = "mahimarkd-plusplus"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
authors = ["Lev Burmistrov (Mahiron-hq)"]
description = "Fast Markdown preview panel for Notepad++"
repository = "https://github.com/Mahiron-hq/MahiMarkD-PlusPlus"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ammonia = "4.2.5"
crc32fast = "1.5.5"
flate2 = "1.1.11"
imagesize = "0.15.0"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
webview2-com = "0.39.1"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
